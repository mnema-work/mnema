name: Scorecard

# WHAT THIS IS. The OpenSSF Scorecard: a score of how the repository holds the practices that make
# a supply-chain attack harder (pinned dependencies, narrow workflow tokens, a branch that needs
# review, a security policy, signed releases, a fuzzer or a scanner). It reads the repository's
# settings and history through the API and runs nothing of it.
#
# THE RESULT goes two places: to code scanning as a SARIF file, where each check that scores low
# is an alert the maintainer judges, and, with `publish_results`, to the Scorecard service, which
# serves the badge in the README. Publishing makes the score and the checks public; they describe
# a public repository.
#
# THE ACTION MUST BE ALLOWED. `ossf/scorecard-action` is not GitHub's own, and the repository's list of
# allowed actions has to name it (`ossf/scorecard-action@*`) before this workflow can start: until then
# GitHub refuses the run at startup. It is the one action here that cannot be replaced by a pinned
# binary, because the service that serves the badge accepts a result only from the action.
#
# IT RUNS ONCE A WEEK, on `main` when it changes, and by hand. It is never a gate: a score is read,
# not waived. The job holds nothing the action does not ask for (`id-token` is how the service
# knows the result comes from this workflow, and the service refuses a workflow with any other
# step in this job).

on:
  push:
    branches: [main]
  schedule:
    # Wednesdays, 05:30 UTC.
    - cron: '30 5 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: scorecard

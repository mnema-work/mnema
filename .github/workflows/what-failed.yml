name: What failed

# WHAT THIS IS. Once CI is over for a pull request, this says on the pull request what failed and
# the command that fixes it, in one comment rewritten after every run, and welcomes a first pull
# request. CI cannot do it itself: a pull request from a fork runs with a read-only token. So CI's
# last job writes a small report as an artifact (`what-failed` in `ci.yml`), and this workflow,
# started by GitHub when that run completes, reads it and comments.
#
# THE LINE IT HOLDS. This workflow can write on pull requests, and the report was written by code
# the pull request controls. So it runs nothing of the pull request: it checks out this
# repository's default branch only (no `ref`, no `repository`), for `.github/what-failed/`; it
# installs nothing and runs no package script; it downloads the report outside the workspace and
# reads it as JSON data, refused whole past a size or a shape; every text of it goes into the
# comment inside a fence it cannot close, with no `@` that notifies; and the pull request is found
# by the run's head SHA through the API. No expression of the event is put into a shell line: the
# script reads the event file GitHub wrote. `.github/what-failed/README.md` says the rest, and
# `the-comment-runs-nothing-of-the-fork.test.ts` holds these lines.
#
# A run Dependabot started is skipped: GitHub hands this workflow a read-only token for it, and the
# comment could not be written.
#
# GitHub starts it only from the workflow file on the default branch, so a pull request that
# changes this file does not change what runs for that pull request.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: comment what failed
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/what-failed

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download the report of the run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: what-failed
          path: ${{ runner.temp }}/what-failed
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Write the comment, or rewrite the one that is there
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/what-failed/report.json
        run: node .github/what-failed/comment.mjs "$GITHUB_EVENT_PATH" "$REPORT"

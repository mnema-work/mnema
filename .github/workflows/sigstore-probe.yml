name: Sigstore probe

# WHAT THIS IS. The one run of `mnema witness sigstore` against the real Sigstore: Fulcio and
# Rekor at sigstore.dev, with this job's own OIDC token. The suite drives the act against
# Sigstore's own test doubles and never reaches the network; this is where the doubles are checked
# against the service they stand for.
#
# WHAT IT DOES. It builds the binary, writes a disposable record in a temporary directory under a
# temporary HOME (nothing of this repository's own is signed or read), names this workflow as the
# record's Sigstore identity with `mnema key sigstore`, countersigns the record's checkpoint with
# `mnema witness sigstore`, and reads the bundle back with `mnema verify --against-sigstore`.
#
# THE OFFLINE CHECK. It then runs `mnema witness sigstore-check` with this workflow's identity and
# the issuer GitHub Actions tokens carry, which is the check a third party makes offline from the
# bundle alone, and prints the `cosign verify-blob` line that checks the same bundle with cosign.
# That is the one place the check meets a certificate Fulcio really issued: the suite's bundles
# are signed by Sigstore's test doubles.
#
# WHEN IT FAILS. When `verify` exits non-zero, or when its JSON does not hold exactly what the act
# promises: at least one bundle, every bundle read as `signed`, by this workflow's identity, and
# named by an identity of the record, and carrying the repository, the commit and the run of THIS job
# (Fulcio's extensions 12, 13 and 21, read from the real certificate). `--against-sigstore` answers in notes and never moves the
# exit, so the exit alone would be green over a bundle that does not hold; the notes are the
# criterion, read from `--json`.
#
# WHAT LEAVES. This workflow's identity (the repository, the file and the ref) goes into
# Sigstore's public log, which does not forget. That is why it runs only by hand, and why the act
# refuses a private repository (it is not worked around here).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: countersign a disposable record and read it back
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Countersign a disposable record and read it back
        env:
          # The identity Fulcio writes into the certificate of a job of this workflow.
          IDENTITY: https://github.com/${{ github.workflow_ref }}
          # The OpenID issuer of a GitHub Actions token, which Fulcio writes into the certificate.
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/packages/code/dist/bundle/cli.js"
          work="$(mktemp -d "$RUNNER_TEMP/sigstore-probe.XXXXXX")"
          export HOME="$work/home"
          mkdir -p "$HOME" "$work/record"
          cd "$work/record"
          git init -q .

          node "$bin" init
          node "$bin" memory "A disposable record, written to be countersigned by Sigstore once."
          node "$bin" key sigstore "$IDENTITY"
          node "$bin" witness sigstore

          node "$bin" verify --against-sigstore
          node "$bin" verify --against-sigstore --json > "$work/verify.json"

          # The same bundle, checked offline against who a third party would expect: this
          # workflow, vouched for by GitHub's token issuer. Exit 0 only when every bundle holds
          # and names both; the line it prints for cosign is kept in the log to be run by hand.
          node "$bin" witness sigstore-check \
            --identity "$IDENTITY" \
            --issuer "$ISSUER" \
            --message-dir "$work/messages" | tee "$work/check.txt"
          grep -q '^cosign verify-blob ' "$work/check.txt" || {
            echo "sigstore-check printed no cosign verify-blob line" >&2
            exit 1
          }

          node -e '
            const fs = require("node:fs");
            const read = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const identity = process.env.IDENTITY;
            const findings = read.sigstore?.findings ?? [];
            const server = process.env.GITHUB_SERVER_URL;
            const repo = process.env.GITHUB_REPOSITORY;
            const ran = {
              repository: `${server}/${repo}`,
              commit: process.env.GITHUB_SHA,
              run: `${server}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
            };
            const wrong = findings.filter(
              (f) =>
                f.reading?.kind !== "signed" ||
                f.reading.identity !== identity ||
                f.namedBy === undefined ||
                f.reading.ran?.repository !== ran.repository ||
                f.reading.ran?.commit !== ran.commit ||
                f.reading.ran?.run !== ran.run,
            );
            if (findings.length === 0 || wrong.length > 0) {
              console.error(`the bundles do not hold what the act promises (${findings.length} read):`);
              console.error(JSON.stringify(read.sigstore, null, 2));
              process.exit(1);
            }
            console.log(`${findings.length} bundle(s) signed by ${identity}, named by the record`);
          ' "$work/verify.json"

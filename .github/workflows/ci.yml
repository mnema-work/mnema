name: CI

on:
  push:
    # The trunk was named `main-v1` until 2026-10-05, and twelve merges landed on it before
    # it was named here; none of them had ever run on a runner.
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE SUITE IN THREE SHARDS PER NODE. One job of the whole suite took 11 to 14 minutes and sat
  # on the critical path of every pull request; three shards run at the same time, and each takes
  # a third of the files. `--shard=k/3` splits the FILES, so what is run is the same set: the
  # guard `the-suite-is-split-whole` checks that `shard:` lists 1 to N and that every step that
  # takes `--shard` takes `/N` of the same N, and the case count of the three together is the
  # case count the unsplit run had. Lint and the type-check are not here: they do not depend on
  # the Node under the suite, so they run once, in `lint-and-typecheck` below.
  test:
    name: test (node ${{ matrix.node }}, shard ${{ matrix.shard }}/3)
    # Pinned rather than `ubuntu-latest`. Not because the next image breaks the suite: the
    # primitives `tests/support/pty.ts` needs (`script -qec`, `stty -F`) were checked on
    # util-linux 2.39.3 and 2.41.3 and behave identically on both. It is pinned because a
    # repository that stamps the build behind every measurement cell should not let the image
    # under the runner change without anybody deciding it. Moving to 26.04 is a one-line diff.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor comes from `engines.node`, and `the-runtime-floor-is-declared-once` fails
        # if this list stops naming it to the patch. 24.15.0 is that floor, and below 24.19 Node
        # still accepts a small-order Ed25519 point on its own, so it is the cell that proves the
        # strict rule is the product's and not the runtime's. 24 is what development runs on: a CI
        # that never runs the runtime the code is written on is not checking what is being
        # written. 26 is the open end of the range.
        node: ['24.15.0', '24', '26']
        shard: ['1', '2', '3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # WHAT THE SUITE LEAVES IN /tmp, half one. 187 prefixes are built under `tmpdir()` by this
      # workspace and exactly one of them is watched by a test, because the obvious watch, list
      # the directory before and after, is a race inside a suite that runs several files at once.
      # It is not a race here: nothing of ours is running at this point in the job, so what appears
      # between this listing and the one after the last vitest step is what the run left.
      - name: What the suite left behind (before)
        run: pnpm what-the-suite-left-behind --record

      # The JSON report is kept because it carries a duration per case, and durations off the
      # runner are the one thing no workstation and no container can supply. It ANSWERED, once,
      # the question `the-ceiling-belongs-to-the-case` names as beyond a source scan: whether
      # any case is near the ceiling it shares. It is no longer the only thing that does: `pnpm
      # test` now also leaves the ledger the step below reads, which carries the ceiling each
      # case ran under as well as its duration, and answers that question on every run instead
      # of on the day somebody downloads this artifact and reads it by hand.
      # HOW LONG AN FSYNC TAKES ON THIS RUNNER WHILE THE SUITE RUNS, on the plain cell of the
      # floor node only. Cases that take 0.03 s have been seen stopped for 5 to 10 s with the
      # machine reporting one runnable thread, and the record's appends are fsynced. The probe
      # writes one small file, fsynced, every 250 ms in the temp directory the suite writes in,
      # and the step after the suite stops it: it reports the median, the p99 and the worst
      # instants to the job summary and to an artifact, beside the ledger's own clock. It is
      # a measurement and gates nothing.
      - name: Start the fsync probe
        if: matrix.node == '24.15.0'
        run: |
          node .github/the-disk-answers/fsync-probe.mjs --out "$RUNNER_TEMP/fsync-probe.json" &
          echo $! > "$RUNNER_TEMP/fsync-probe.pid"

      - name: Test
        if: matrix.node != '24'
        run: pnpm test --shard=${{ matrix.shard }}/3 --reporter=json --outputFile.json=vitest-report.json

      # ONE PASS ON NODE 24: this step is the suite for that cell, instrumented. The gate, the
      # `thresholds` of `vitest.config.ts`, is read off the three shards MERGED, in
      # `the-coverage-gate` below, because a third of the suite covers a third of the code and
      # would never meet a floor measured on the whole. Vitest checks `thresholds` after every
      # run that has coverage on, so here each one is set to 0 on the command line: that turns
      # the check off in this step and nowhere else, and the numbers still go into the blob that
      # the merge reads. The blob is written outside a hidden directory because an artifact
      # upload leaves hidden paths out. It used to be a SECOND run of the suite, kept apart
      # because instrumentation costs the slowest case that shares the five-second ceiling more
      # than it costs the wall clock; measured on the runner, the slowest case instrumented took
      # 0.77 of that ceiling. The suite is still run plain on 24.15.0 and 26, so the matrix still
      # has both kinds of run.
      - name: Coverage of the shard
        if: matrix.node == '24'
        run: pnpm test:coverage
          --shard=${{ matrix.shard }}/3
          --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0
          --coverage.thresholds.lines=0
          --reporter=blob
          --outputFile.blob=vitest-blob/blob-${{ matrix.shard }}-3.json
          --reporter=json
          --outputFile.json=vitest-report.json

      - name: Upload the coverage of the shard
        if: matrix.node == '24' && (success() || failure())
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: vitest-blob/
          if-no-files-found: error

      - name: Stop the fsync probe
        if: always() && matrix.node == '24.15.0'
        continue-on-error: true
        run: |
          kill -TERM "$(cat "$RUNNER_TEMP/fsync-probe.pid")"
          for _ in $(seq 1 50); do [ -s "$RUNNER_TEMP/fsync-probe.json" ] && break; sleep 0.1; done
          # THE PAGE IS WRITTEN HERE, NOT BY THE PROBE: a job summary belongs to the step that
          # writes it, and the probe starts in an earlier step that is closed by now.
          node .github/the-disk-answers/fsync-probe.mjs --render "$RUNNER_TEMP/fsync-probe.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the fsync probe
        if: always() && matrix.node == '24.15.0'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fsync-probe-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/fsync-probe.json
          if-no-files-found: warn

      # WHY IT WENT RED, AND WHAT A RETRY HID. `pnpm test` leaves a ledger behind: a duration,
      # the ceiling each case actually ran under, and what the machine was doing in that case's
      # own window. This reads it and RE-RUNS every red on its own, so the page says which reds
      # reproduce alone (the guard catching something) and which do not. Two deliveries had to
      # discount reds by hand as machine contention before this existed.
      #
      # It cannot turn a red green: the step above has already failed by the time this runs, and
      # this one is `continue-on-error` so that a broken ruler here never masks the red it was
      # asked to explain.
      #
      # IT ALSO RUNS ON A GREEN RUN, because a case that ended on its ceiling is run once more in
      # CI and passes on the retry (`.github/a-timeout-is-run-once-more/retry.mjs`): the run is
      # green and the first attempt is only in the ledger. The page names each such case as a
      # flake, so a retry that keeps the run green never keeps it quiet. On a green run the page is
      # titled for what it is and the step exits 0 (`--run-passed`): a failure annotation on a
      # green job would say the opposite of the job.
      - name: Why it went red
        if: success() || failure()
        continue-on-error: true
        run: pnpm why-it-went-red ${{ job.status == 'success' && '--run-passed' || '' }} --summary "$GITHUB_STEP_SUMMARY" --json why-it-went-red-verdict.json

      - name: Upload the verdict
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: why-it-went-red-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: |
            node_modules/.cache/mnema-workspace/why-it-went-red.json
            why-it-went-red-verdict.json
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: vitest-report.json
          if-no-files-found: warn

      # …and half two, which is why it sits at the END of the job rather than beside the test
      # steps: a sweep taken while a vitest is still writing would read a /tmp that run is about
      # to change. It refuses outright if any vitest is still alive, so an ordering mistake here
      # reports `RULER BROKEN` rather than a wrong answer, and `continue-on-error`, because a
      # leaked directory is worth a red build no more than a broken ruler is worth masking the
      # reds above it.
      - name: What the suite left behind (after)
        if: always()
        continue-on-error: true
        run: pnpm what-the-suite-left-behind --summary "$GITHUB_STEP_SUMMARY" --json what-the-suite-left-behind-verdict.json

      - name: Upload what the suite left behind
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: what-the-suite-left-behind-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: what-the-suite-left-behind-verdict.json
          if-no-files-found: ignore

  # THE THRESHOLDS, READ OFF THE WHOLE SUITE. The three shards of node 24 each leave a blob (the
  # step `Coverage of the shard`), and this job merges them and checks `thresholds` of
  # `vitest.config.ts` against the merged figures, which are the ones the unsplit run measured.
  # It runs no test: `pnpm exec vitest --merge-reports` reads what the shards wrote, so it is not
  # a run of the suite that `what-the-suite-left-behind` has to bracket, and it must never
  # become one (`what-the-suite-left-behind.test.ts` fails if it runs `pnpm test` here). It
  # counts the blobs first: a merge of two would report a lower figure and blame the code.
  the-coverage-gate:
    name: the coverage gate
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the coverage of the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: vitest-blob

      - name: Count the blobs
        run: |
          found="$(find vitest-blob -name 'blob-*-3.json' | wc -l)"
          if [ "$found" != '3' ]; then
            echo "::error::expected the 3 blobs of the 3 shards, found $found"
            exit 1
          fi

      - name: Merge the shards and check the thresholds
        run: pnpm exec vitest --merge-reports=vitest-blob --coverage

  # LINT AND THE TYPE-CHECK, ONCE. They used to run in every cell of the test matrix, three times
  # for a result that does not depend on the Node under the suite. The steps keep their names:
  # `Lint` is what `.github/what-failed/collect.mjs` looks for to put the files `biome check
  # --write` changes on the comment of a pull request.
  lint-and-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check the tests
        run: pnpm typecheck

  # THE SECOND READER ON ITS PYTHON FLOOR. Two pages promise that `packages/chain/verifier/` runs
  # on the Python its own README names "or later", and until this job every case that starts it
  # ran on whatever `python3` the image carried: the matrix above sets up no Python, and
  # `ubuntu-24.04` ships 3.12. The floor had been checked for its grammar once, by hand, and never
  # run. A floor CI never runs is a floor nobody has checked, which is the sentence the node floor
  # already stands on.
  #
  # WHAT IT RUNS, AND WHY ONLY THAT. Every test file that starts `python3`, and nothing else: the
  # rest of the suite never calls the reader, so running it again here would buy nothing. That is
  # the reader's self-test and the published vectors (two cases of
  # `second-reader-agrees-on-the-record`), the frozen records and every input `mutate.py` builds,
  # the records the product writes in-process, section 1 over a corpus, the gaps registry, the
  # page's own first record and the tarball's own copy. THE LIST IS NOT THIS FILE'S TO KEEP:
  # `the-python-floor-is-declared-once` finds the files by the literal that starts the interpreter
  # and is red until this step runs each of them, and red if the version below is not the one the
  # pages state.
  #
  # `PYTHON3_IS_THE_FLOOR` IS THE JOB SAYING WHAT IT SET UP. With it, the case that asks the
  # interpreter requires the `python3` the cases call to be the floor EXACTLY, so an image or an
  # action that stopped putting this Python first on `PATH` turns this job red instead of green on
  # the image's own. Without it (a workstation, the matrix, the flake sampler) the same case asks
  # only that it be no lower.
  the-second-reader-on-its-python-floor:
    name: the second reader on its python floor
    runs-on: ubuntu-24.04
    env:
      PYTHON3_IS_THE_FLOOR: '1'
      # The cases start the reader, and a reader that runs writes `__pycache__` beside its modules;
      # the case that packs the tarballs runs after them, in the same tree, and found seventeen
      # `.pyc` in `@mnema/chain`. The guard is right; the job must not leave the cache behind.
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The code cases import the other packages from `dist`, and one of them packs the tarballs.
      - name: Build
        run: pnpm build

      # THE READER TYPE-CHECKED AGAINST ITS FLOOR. The cases find what the floor lacks only on a
      # line they reach, and only one error at a time: the reader first failed here on import, on
      # a `bytes | str | None` alias, which is 3.9's grammar and 3.10's library. `mypy`, told the
      # floor, reads every line of the reader and names that class of error without running it.
      # 1.19.1 is pinned: it is the last release that installs on 3.9, the only Python this job
      # sets up; 1.20 still targets 3.9 but needs 3.10 to run, and 2.0 refuses 3.9 as a target.
      # Installing a checker here does not break the reader's promise,
      # which is about what it needs to RUN, not to be checked; and it goes into a venv of its
      # own, so the `python3` the cases call below still has nothing but the standard library.
      # The cases run after a failed check too, so one run says both what the checker saw and
      # what the floor did.
      - name: Type-check the second reader against its floor
        id: types
        run: |
          python -m venv "$RUNNER_TEMP/types"
          "$RUNNER_TEMP/types/bin/pip" install --disable-pip-version-check mypy==1.19.1
          "$RUNNER_TEMP/types/bin/mypy" --python-version 3.9 --warn-unused-ignores --cache-dir "$RUNNER_TEMP/types-cache" packages/chain/verifier/
          # The linter reads the rules in the reader's own `pyproject.toml`; it is in the same
          # venv, for the same reason as the type checker.
          "$RUNNER_TEMP/types/bin/pip" install --disable-pip-version-check ruff==0.17.2
          "$RUNNER_TEMP/types/bin/ruff" check --no-cache packages/chain/verifier/

      # `vitest` and not the `test` script: `what-the-suite-left-behind` counts every step of this
      # file that runs that script as a run of the suite its sweep has to bracket, and this one
      # runs on a runner of its own, which that sweep never sees. It reads this comment too, so
      # the comment does not spell the step it is about.
      - name: Every case that starts python3
        if: success() || steps.types.outcome == 'failure'
        run: >-
          pnpm exec vitest run
          packages/action/src/world.test.ts
          packages/chain/src/chain/a-history-rewritten-without-the-key-is-never-signed.test.ts
          packages/chain/src/chain/a-key-file-that-holds-no-key-is-refused.test.ts
          packages/chain/src/chain/a-kind-this-reader-does-not-know-is-read-past.test.ts
          packages/chain/src/chain/a-reformat-is-named-only-where-the-signatures-prove-it.test.ts
          packages/chain/src/chain/a-refused-line-hides-nothing-else-in-its-tail.test.ts
          packages/chain/src/chain/a-tail-is-not-forked.test.ts
          packages/chain/src/chain/a-tail-of-another-record-is-refused.test.ts
          packages/chain/src/chain/both-readers-read-the-same-bytes.test.ts
          packages/chain/src/chain/every-reader-refuses-bytes-that-are-not-utf8.test.ts
          packages/chain/src/chain/outside-vectors.test.ts
          packages/chain/src/chain/second-reader-agrees-on-a-relink.test.ts
          packages/chain/src/chain/second-reader-agrees-on-enrolment.test.ts
          packages/chain/src/chain/second-reader-agrees-on-the-bytes.test.ts
          packages/chain/src/chain/second-reader-agrees-on-the-order-of-tails.test.ts
          packages/chain/src/chain/second-reader-agrees-on-the-record.test.ts
          packages/chain/src/chain/second-reader-agrees-on-what-is-not-applied.test.ts
          packages/chain/src/chain/second-reader-agrees-over-generated-input.test.ts
          packages/chain/src/chain/second-reader-names-a-refused-founding-once.test.ts
          packages/chain/src/chain/second-reader-says-what-it-does-not-check.test.ts
          packages/chain/src/chain/second-reader-session.test.ts
          packages/chain/src/chain/the-promise-between-versions.test.ts
          packages/chain/src/chain/the-writer-names-the-record.test.ts
          packages/chain/src/format-doc.test.ts
          packages/code/src/site/the-verdict-in-the-browser.test.ts
          packages/code/tests/a-record-holding-a-kind-this-mnema-does-not-know.test.ts
          packages/code/tests/a-record-no-tail-holds-is-refused.test.ts
          packages/code/tests/a-relinked-tail-passes-since.test.ts
          packages/code/tests/a-tail-that-holds-keys-is-not-cut-without-naming-them.test.ts
          packages/code/tests/a-write-killed-at-any-point-is-signed-by-the-next.test.ts
          packages/code/tests/both-readers-refuse-swapped-checkpoints-and-a-linked-tail.test.ts
          packages/code/tests/every-verifier-gives-one-ed25519-verdict.test.ts
          packages/code/tests/ten-writers-one-record.test.ts
          packages/code/tests/the-agent-ci-step-installs-the-key-the-agent-signs-with.test.ts
          packages/code/tests/the-front-page-says-what-its-sources-say.test.ts
          packages/code/tests/the-owner-relinks-a-tail.test.ts
          packages/code/tests/the-page-holds-against-someone-without-the-key.test.ts
          packages/code/tests/the-private-tree-moves-out-of-the-worktree.test.ts
          packages/code/tests/the-python-floor-is-declared-once.test.ts
          packages/code/tests/the-record-name-survives-a-cut-of-its-genesis.test.ts
          packages/code/tests/the-verifier-a-page-publishes-runs.test.ts
          packages/code/tests/what-a-package-publishes-is-what-its-page-promises.test.ts

  # THE EXTENSION AS A FILE. `packages/vscode` is private and is not sent anywhere, so until this
  # job nothing proved that it can be packed at all: the only route to a `.vsix` was by hand. This
  # builds the file and keeps it as an artifact of the run, which a person can download and install
  # with `code --install-extension`. THAT IS WHERE IT STOPS: there is no marketplace token in this
  # file and no step that publishes, and `no-workflow-publishes-the-extension.test.ts` fails if one
  # appears. It is not a required check and nothing waits for it.
  the-extension-as-a-file:
    name: the extension as a file
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle is made from the built `dist` of the two workspace packages it takes two functions from.
      - name: Build
        run: pnpm build

      - name: Pack the extension
        run: pnpm --filter @mnema/vscode package

      # No token: what a store reads of the file, read from the file. A manifest a store would refuse (still
      # `private`, no icon, no category, a description that says it is not published) fails here, before a
      # release has to find it.
      - name: Check that the file is one a store takes
        run: |
          set -euo pipefail
          for vsix in packages/vscode/mnema-*.vsix; do node packages/vscode/build/check-the-vsix.mjs "$vsix"; done

      - name: Upload the extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mnema-vscode-extension
          path: packages/vscode/mnema-*.vsix
          if-no-files-found: error

      # The file, installed into a real VS Code (downloaded here, free) with `--install-extension`,
      # in three workspaces: with no `.mnema` (it has to stay asleep), with a `.mnema` and a command
      # that does not exist (the bar has to say so), and with a real record. No screen on a runner,
      # so the editor runs under a virtual one.
      - name: Install it in VS Code and check what it does in each
        run: xvfb-run -a pnpm --filter @mnema/vscode install-check

  # THE BINARY SAYS WHY, ON A NODE IT CANNOT RUN ON. The suite runs on a Node that has `node:sqlite`,
  # and a Node that has it cannot show what one that lacks it does: the module graph is linked before
  # the first line of the first module runs, so a floor check that is merely the first import of an
  # entry linking the whole program speaks after the link has failed (a Node before 22.13 throws
  # `ERR_UNKNOWN_BUILTIN_MODULE` and says nothing of the floor) or after the builtin has warned (a 24
  # before 24.15 prints `ExperimentalWarning` first). A version faked on a Node that has the module
  # was blind to both. So this job builds with a Node the floor accepts, then runs the built
  # `--version` under real Nodes below it, one each: 20 (no `node:sqlite` at all), 22.12 (the module
  # is behind a flag) and 24.14 (the module warns). Each must exit 1 with the floor's one sentence on
  # stderr and nothing before or after it. It needs no secret and no network beyond `setup-node`.
  the-binary-refuses-an-old-node:
    name: the binary refuses an old Node (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '22.12.0', '24.14.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The Node under the binary changes here, after the build and for nothing else.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # The bundle the `bin` names, which links chunks the bundler chose.
      - name: The built binary refuses it in one line
        run: bash .github/the-binary-runs/it-refuses-an-old-node.sh

      # The compiled entry the bundle is built from is still in the package, so it is run the same way.
      - name: The compiled binary refuses it in one line
        run: bash .github/the-binary-runs/it-refuses-an-old-node.sh packages/code/dist/cli.js

  # THE DOCS BUILD ON THE SITE. The pages of `docs/` are published by the site, which is built in its own repository
  # (mnema-work/mnema.work) from the latest release of this one. A page the site could not build, such as a link that
  # leaves the repository or a marker that does not pair, would stop the next publication, and nothing here would have
  # said so. So every pull request runs the site's own build over the docs of this checkout, in its check mode
  # (`--check`: any commit, no release tag, no build of the product, and nothing it makes is kept). The site is read at
  # its `main`, a public repository, with no token; this job holds `contents: read` and no secret. It runs on every pull
  # request, so it can be made a required check without a pull request that leaves `docs/` alone waiting for it.
  the-docs-build-on-the-site:
    name: the docs build on the site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mnema-work/mnema.work
          ref: main
          path: site
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci --ignore-scripts

      - name: Build the docs of this checkout
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: node build/build.mjs --from "$GITHUB_WORKSPACE/product" --check

  # THE SKILLS ORACLE. A stack carries skills written by somebody else, and what makes one valid is
  # the Agent Skills specification, which publishes a validator of its own, `skills-ref` (PyPI; its
  # command is `agentskills`). This repository checks skills with a validator of its own too, and
  # two validators are worth having only if they are held to each other: the cases of
  # `the-skills-ref-oracle-agrees` run both over the same skills and require the same verdict.
  # The oracle is from outside and is installed here, pinned, for that and nothing else; it is
  # never a dependency of the product. `SKILLS_REF_IS_THE_ORACLE` makes an absent oracle a red
  # instead of a skip. It needs no secret and no account: a pinned package from the public index.
  the-skills-oracle:
    name: the skills oracle
    runs-on: ubuntu-24.04
    env:
      SKILLS_REF_IS_THE_ORACLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the oracle, pinned
        run: python3 -m pip install skills-ref==0.1.1

      - name: Both validators, the same verdict
        run: pnpm vitest run packages/stacks/tests/the-skills-ref-oracle-agrees.test.ts

  # THE EXAMPLE STACKS INSTALL. The stacks this repository ships as examples are the ones a person
  # is most likely to try first, so they are installed here the way a person installs one: the BUILT
  # binary reads each from its folder, shows the plan, writes it under a sandbox `HOME` (a fresh
  # temporary folder the test makes; nothing of the runner's own home is touched), and the record
  # still verifies. Then `skills-ref`, pinned as in the oracle job, validates every installed skill
  # folder, and the stack index is held to the stacks it lists. Nothing of a stack is executed: the
  # folders hold text and the binary only copies it. No secret, no account, and no network beyond
  # the package indexes `setup-node` and `pip` already use.
  the-example-stacks-install:
    name: the example stacks install
    runs-on: ubuntu-24.04
    env:
      SKILLS_REF_IS_THE_ORACLE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the oracle, pinned
        run: python3 -m pip install skills-ref==0.1.1

      - name: Build
        run: pnpm build

      - name: Install each example in a sandbox home, and hold the index to them
        run: >-
          pnpm vitest run
          packages/code/tests/the-example-stacks-install.test.ts
          packages/stacks/tests/the-example-stacks-hold.test.ts
          packages/stacks/tests/the-index-names-the-stacks-it-lists.test.ts

  # THE GUARDS, FAST. The cases that walk the whole tree (a file nobody tests, a page that drifted
  # from what the binary prints, a workflow nobody listed) are the ones a change breaks without
  # touching them, and they used to show red only when the matrix finished. They carry the line
  # `// @reads-the-tree`, `vitest.guards.config.ts` runs those and nothing else, and this job runs
  # that config on one Node, in parallel with the matrix, so the same red shows up early. It is the
  # same cases the matrix runs, not a replacement for it, and nothing waits for it.
  #
  # `vitest` and not the `test` script, for the reason the python floor job gives: the sweep of what
  # the suite leaves behind reads this file for the steps that run that script, and this job runs on
  # a runner of its own that sweep never sees.
  the-guards:
    name: the guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Some of the cases read `dist`, so the build is not optional here.
      - name: Build
        run: pnpm build

      # The JSON report is for the job `what-failed` below, which names the cases that failed.
      - name: The cases that read the whole tree
        run: pnpm exec vitest run --config vitest.guards.config.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile.json=vitest-report.json

      - name: Upload test report
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-report-guards
          path: vitest-report.json
          if-no-files-found: ignore

  # THE USER'S OWN PATH ON WINDOWS AND ON macOS. Every other job runs on `ubuntu-24.04`, while
  # `docs/install.md` tells people on both of the others to install and run mnema. This job packs
  # the five packages, installs them together with `npm i -g` (so the launcher is the one npm
  # writes on that system: `mnema.cmd` on Windows), and drives the INSTALLED binary through `init`,
  # `decision record`, a rule that refuses a write, `verify`, a clone checked out with
  # `core.autocrlf=true` (the record must still verify), the Python reader over it, `doctor`, and
  # the plugin's hook handlers on payloads whose paths are written the way that system writes them
  # (backslashes, drive letters, the temp directory's second spelling, upper case on the
  # case-insensitive volume). The steps are `.github/the-other-systems/smoke.mjs`, so the same
  # command runs on a workstation: `pnpm build && node .github/the-other-systems/smoke.mjs`.
  #
  # WHY A SMOKE AND NOT THE SUITE. The suite is about ten minutes on Ubuntu with eight cores and
  # leans on `sh`, `script -qec`, `stty -F` and `unshare`, none of which a Windows runner has; the
  # cases that hold the product's rules do not change with the operating system, and the ones that
  # do (paths, line endings, the launcher, the second reader) are what this runs. What is proven
  # on each system is stated in `docs/platforms.md`, and no more than this job runs.
  #
  # TWO NODES. 24.15.0 is the floor and 24 is what development runs on; 26 adds a third runtime
  # that the Ubuntu matrix already runs and no operating system changes. Each system runs both.
  the-other-systems:
    name: windows and macos (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node: ['24.15.0', '24']
    steps:
      # THE REPOSITORY'S OWN FIXTURES NEED LONG PATHS. A witnessed tail is
      # `tails/<64 hex>-<32 hex>/witness/<64 hex>.blocks`, and one frozen fixture of `@mnema/chain`
      # reaches 245 characters below the root: past Windows' 260 once the checkout directory is
      # added, so `git checkout` stops with "Filename too long". This is about the clone of THIS
      # repository, not about the installed product, whose own paths the smoke measures.
      - name: Let git write long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack, install, init, record, verify, the second reader, doctor, the hooks
        run: node .github/the-other-systems/smoke.mjs

  # THE NEWCOMER'S PATH. Every other job runs the workspace's own `dist`, or installs the binary and
  # drives it through a pipe; none of them runs what the README tells a person to type. This packs the
  # five as the release does (`pnpm pack`), installs the tarballs with `npm i -g` into an empty prefix
  # and an empty HOME, and runs the Quick start block of the README, read from the README at run time,
  # in a git repository and under a pseudo-terminal that answers the questions `mnema init` asks with
  # Enter. Then it checks that the decision the block recorded is the one accepted and linked, and that
  # `verify` is green. A block that stops running makes this red. It runs on the Node at the floor, on
  # every pull request and push (no path filter), so it can be made a required check without a pull
  # request that leaves the README alone waiting for it; making it one is the maintainer's call.
  # `the-newcomer-path-runs-the-page.test.ts` reads this job and the script.
  the-newcomer-path:
    name: the newcomer's path from the packed files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack, install the tarballs, run the README's quick start in a terminal, verify
        run: bash .github/the-newcomer-path/run.sh

  # WHAT FAILED, FOR THE COMMENT. On a pull request, once every other job is over, this writes down
  # what failed in a small JSON artifact: the failing jobs and steps, the verdict of
  # `.github/why-it-went-red/`, the failing cases with what each said, and, when a `Lint` step
  # failed, the files `biome check --write` changes and the diff. It runs with this run's read-only
  # token and no secret, like every job here, and comments on nothing: a pull request from a fork
  # cannot. `.github/workflows/what-failed.yml` reads the artifact once the run is over, as data,
  # and keeps one comment on the pull request. `.github/what-failed/README.md` says how and why.
  #
  # `needs` names every other job of this file, so the report is written after all of them;
  # `the-comment-runs-nothing-of-the-fork.test.ts` fails if a job is added and not named here. It
  # never turns a run red: a report that cannot be written is said on the comment instead.
  what-failed:
    name: what failed, for the comment
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs:
      - test
      - the-coverage-gate
      - lint-and-typecheck
      - the-second-reader-on-its-python-floor
      - the-extension-as-a-file
      - the-binary-refuses-an-old-node
      - the-docs-build-on-the-site
      - the-skills-oracle
      - the-example-stacks-install
      - the-guards
      - the-other-systems
      - the-newcomer-path
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: List the jobs of this run
        id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          echo "lint=$(node .github/what-failed/collect.mjs lint-failed "$RUNNER_TEMP/jobs.json")" >> "$GITHUB_OUTPUT"

      - name: Download the test reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-report-*
          path: ${{ runner.temp }}/artifacts

      - name: Download the verdicts
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: why-it-went-red-*
          path: ${{ runner.temp }}/artifacts

      - if: steps.jobs.outputs.lint == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: What biome would change
        if: steps.jobs.outputs.lint == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec biome check --write packages/ plugin/ .github/ .claude-plugin/ || true
          git diff --name-only > "$RUNNER_TEMP/lint-files.txt"
          git diff > "$RUNNER_TEMP/lint.diff"

      - name: Write the report
        env:
          LINT: ${{ steps.jobs.outputs.lint }}
        run: |
          set -euo pipefail
          lint=()
          if [ "$LINT" = 'true' ]; then lint=(--lint-files "$RUNNER_TEMP/lint-files.txt" --lint-diff "$RUNNER_TEMP/lint.diff"); fi
          node .github/what-failed/collect.mjs report --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts" --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/what-failed/report.json" "${lint[@]}"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: what-failed
          path: ${{ runner.temp }}/what-failed/report.json
          retention-days: 7
          if-no-files-found: error

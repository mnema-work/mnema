name: Workflow audit

# WHAT THIS IS. `zizmor`, a static reader of GitHub Actions workflows, over `.github/workflows`: a
# checkout that leaves its credential on disk, a trigger that runs a stranger's text with a token, an
# expression of the event pasted into a shell line, a permission wider than the job needs, a package
# installed outside the lockfile. It runs nothing of the repository.
#
# A FINDING FAILS THE JOB, and the annotations name the file and line. There is no SARIF upload and
# no blanket configuration: a finding is fixed in the workflow, or it carries `# zizmor: ignore[rule]`
# on its own line with the reason after it, so the ignore is read next to the thing it excuses.
#
# THE TOOL IS THE RELEASE BINARY, pinned by version and by SHA-256 below, not an action: the
# repository allows GitHub's own actions and the few it lists, and the scanner of the workflows
# should not need one more. Moving to a newer release is a diff of three lines (the version, the
# file, the hash) taken from the release's own digests. Its online audits ask the GitHub API about
# the actions a workflow uses (a SHA that is not on the tag it claims); they use this job's
# read-only token.
#
# IT RUNS on a pull request that touches a workflow or this file, on `main` when one changes, and by
# hand. It is not one of the checks a pull request must carry until the maintainer makes it one.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIZMOR_VERSION: 1.32.0
  ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b

jobs:
  zizmor:
    name: workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor at the pinned release
        run: |
          set -euo pipefail
          file="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${file}" -o "$file"
          echo "${ZIZMOR_SHA256}  ${file}" | sha256sum --check --strict
          tar -xzf "$file" zizmor
          ./zizmor --version

      - name: Audit the workflows
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: ./zizmor --no-progress --format github .github/workflows

name: CodeQL

# WHAT THIS IS. GitHub's static analysis, read from this repository instead of from the settings
# page, so the languages, the query suite and the pinned versions are a diff someone reviews.
# It reads the code for the shapes of a known weakness (a path built from input, a pattern that
# backtracks without end, a workflow that runs text it did not write). It does not run the product.
#
# THREE LANGUAGES, ONE ANALYSIS EACH: JavaScript and TypeScript (the packages), Python (the
# second reader of the record, `packages/chain/verifier`), and the workflows themselves
# (`actions`). None of them needs a build, so each runs with `build-mode: none`.
#
# THE DEFAULT QUERY SUITE, and no other: neither `security-extended` nor `security-and-quality`.
#
# IT RUNS ON A PULL REQUEST, ON `main` AND ONCE A WEEK. The weekly run exists because a query is
# improved without a commit here: the same code can be read again tomorrow and give an alert that
# today's reading did not.
#
# IT IS NOT ONE OF THE CHECKS A PULL REQUEST MUST CARRY, for the reason `scanners.yml` is not: an
# improvement to a query would otherwise stop an unrelated merge. An alert is read in the
# Security tab, and the maintainer decides each one.
#
# A PULL REQUEST FROM A FORK gets a read-only token, so its results cannot be uploaded to the
# Security tab. This workflow does not get around that with the trigger that hands a fork's code
# a write token.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays, 05:00 UTC.
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

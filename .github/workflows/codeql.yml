name: CodeQL

# WHAT THIS IS. GitHub's static analysis, read from this repository instead of from the settings
# page, so the languages, the query suite and the pinned versions are a diff someone reviews.
# It reads the code for the shapes of a known weakness (a path built from input, a pattern that
# backtracks without end, a workflow that runs text it did not write). It does not run the product.
#
# THREE LANGUAGES, ONE ANALYSIS EACH: JavaScript and TypeScript (the packages), the Python of the
# repository (every `.py` file: the second reader of the record in `packages/chain/verifier`, and
# the scripts of the tests and of the measurements), and the workflows themselves (`actions`).
# None of them needs a build, so each runs with `build-mode: none`.
#
# THE DEFAULT QUERY SUITE, and no other: neither `security-extended` nor `security-and-quality`.
#
# IT RUNS ON A PULL REQUEST, ON `main`, ONCE A WEEK AND BY HAND (`workflow_dispatch`). The weekly
# run exists because a query is improved without a commit here: the same code can be read again
# tomorrow and give an alert that today's reading did not.
#
# IT IS NOT ONE OF THE CHECKS A PULL REQUEST MUST CARRY: an alert asks for the maintainer's
# judgement (dismiss it or fix it), so it should not block a merge by itself. An alert is read in
# the Security tab, and the maintainer decides each one.
#
# NO TRIGGER HERE HANDS A FORK'S CODE A WRITE TOKEN: the pull request runs on `pull_request`, with
# the token GitHub gives that event.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tuesdays, 05:00 UTC.
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

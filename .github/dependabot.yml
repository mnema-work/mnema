version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /.github/release-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /.github/mcp-inspector
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: pip
    directory: /.github/python-tools/verifier-checks
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      # The reader's floor stays Python 3.9 (ADR-696): the floor job checks it with `--python-version 3.9`,
      # a target mypy 2.0 drops. Lift this when the floor rises.
      - dependency-name: mypy
        versions: ['>=2.0']
  - package-ecosystem: pip
    directory: /.github/python-tools/skills-ref
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
